# ============================================================
# Profil: trainer
# Scop: antrenament offline al modelului Isolation Forest.
#
# Dezactivează COMPLET web server, JPA, Flyway, Security,
# repositories — ModelTrainerCli are nevoie exclusiv de
# PaySimCsvReader (CSV pe disc) și ModelStore (.bin pe disc).
# ============================================================

# Fără web server — aplicația pornește, rulează ModelTrainerCli, se oprește
spring.main.web-application-type=none

# Dezactivează toate auto-configurările care cer DB sau web
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# Activează modul trainer (citit de FraudServiceApplication pentru a porni ModelTrainerCli)
fraud.tier3.trainer-mode=true

# Dezactivează și Tier3MlService (care încearcă să încarce modelul la @PostConstruct)
# — la antrenament, modelul NU există încă pe disc
fraud.tier3.ml-enabled=false
fraud.tier3.ml.enabled=false
