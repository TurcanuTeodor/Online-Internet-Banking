services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

  auth-service:
  client-service:
  account-service:
  transaction-service:
  payment-service:

  fraud-service:
    expose:
      - "8086"

  api-gateway:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8443:8443"

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:80"

volumes:
  postgres-prod-data: