services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  frontend:
    build:
      target: build
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_PROXY_TARGET: http://api-gateway:8080
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "5173:5173"

  auth-service:
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"

  client-service:
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8082:8082"

  account-service:
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8083:8083"

  transaction-service:
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8084:8084"

  payment-service:
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8085:8085"

  fraud-service:
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  frontend-node-modules:
  postgres-dev-data: